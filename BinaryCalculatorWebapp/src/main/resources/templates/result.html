<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Showing the Results</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<!-- for styling -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
        }

        table {
            margin-left: auto;
            margin-right: auto;
            padding: 16px;
            border-spacing: 8px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(49, 46, 129, 0.15);
        }

        input[type="button"], input[type="submit"] {
            width: 100%;
            padding: 20px 40px;
            background-color: #4f46e5;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.05s;
        }
        input[type="button"]:hover { background-color: #4338ca; }
        input[type="button"]:active, input[type="submit"]:active { transform: scale(0.97); }

        input[type="submit"] { background-color: #f59e0b; }
        input[type="submit"]:hover { background-color: #d97706; }

        input[value="C"], input[value="CE"] { background-color: #ef4444; }
        input[value="C"]:hover, input[value="CE"]:hover { background-color: #dc2626; }

        input[type="text"], select {
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            color: #1e1b4b;
            background: #f8fafc;
            border: 2px solid #c7d2fe;
            border-radius: 10px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
        }
    </style>
</head>
<body>
	<h3>
	<form action="/" method="Post">
		<table id="calcu">
			<tr>
				<td span="2"><input type="text" th:value="${operand1} + ' '+${operator}+' '+${operand2} + '='+ ${result}"  readonly /></td>
			</tr>
			<tr>
				<td ><a href="/" > <input type="button" value="New Calculation" /></a></td>
				<td ><a th:href="'/?operand1='+${result}" > <input type="button" value="Continue Calculation" /></a></td>
			</tr>
		</table>
	</form>
</body>
</html>
